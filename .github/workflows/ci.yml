name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.7.22"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run pytest --nbmake notebooks
      - name: Build wheel
        run: uv build
      - name: Smoke-test clean installed wheel
        run: |
          python -m venv /tmp/genome-evidence-wheel
          /tmp/genome-evidence-wheel/bin/pip install dist/*.whl
          /tmp/genome-evidence-wheel/bin/genome-evidence version
          /tmp/genome-evidence-wheel/bin/genome-evidence doctor
          /tmp/genome-evidence-wheel/bin/genome-evidence prioritize clinical --help
          /tmp/genome-evidence-wheel/bin/genome-evidence ancestry validate-reference --help
          /tmp/genome-evidence-wheel/bin/genome-evidence ancestry project --help
          /tmp/genome-evidence-wheel/bin/genome-evidence pgx --help
          /tmp/genome-evidence-wheel/bin/genome-evidence pgx validate-bundle --help
          /tmp/genome-evidence-wheel/bin/genome-evidence pgx infer --help
