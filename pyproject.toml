[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genome-evidence"
version = "0.2.0"
description = "Reproducible, provenance-first personal-genomics evidence infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["duckdb>=1.2", "numpy>=2.1", "polars>=1.20", "pydantic>=2.10", "typer>=0.15"]

[project.optional-dependencies]
notebook = ["ipykernel>=6.29", "jupyter>=1.1"]

[project.scripts]
genome-evidence = "genome_evidence.cli:app"

[dependency-groups]
dev = [
  "build>=1.2",
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "mypy>=1.14",
  "matplotlib>=3.9",
  "nbmake>=1.5",
  "pre-commit>=4",
  "pytest>=8.3",
  "ruff>=0.9",
  "typer>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genome_evidence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "genome_evidence.population_structure.*"
disable_error_code = ["assignment", "attr-defined", "operator", "call-overload", "var-annotated", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
